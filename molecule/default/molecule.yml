---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: mariadb-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        mariadb_debug_service_enabled: false

        # Variables for MariaDB
        mariadb_uid: 1000
        mariadb_gid: 1000
        mariadb_root_password: password

        # Creating a database and a user for it is what playbooks actually ask
        # this role to do, so the scenario asks for one too. It exercises
        # tasks/util/prepare_managed_database.yml and the SQL template it
        # renders, and gives the verifier an unprivileged account to log in
        # with. Molecule interpolates this file - comments included - so a
        # literal `$$` has to be written doubled, and these values avoid it.
        mariadb_managed_databases_custom:
          - name: molecule_db
            username: molecule_user
            password: molecule-password
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Preparing a managed database renders an SQL file, feeds it to the
    # server and deletes it again, and reports itself as changed every time.
    # The statements it runs are all `IF NOT EXISTS`/`GRANT`, so the effect is
    # idempotent even though the tasks do not report themselves that way, and
    # nothing here can make them report otherwise. Dropping the managed
    # database from this scenario would buy the idempotence check back at the
    # cost of no longer testing what playbooks actually ask this role for.
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
