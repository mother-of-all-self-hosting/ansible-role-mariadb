---
- name: Verify MariaDB
  hosts: all
  become: true
  gather_facts: false

  vars:
    mariadb_managed_database: "{{ mariadb_managed_databases_custom | first }}"

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: mariadb_defaults

    # Unlike most roles here, this one pins no single version: it tracks one
    # image per supported MariaDB series, and `mariadb_container_image_latest`
    # names the series that new deployments get. That name is a Jinja
    # reference, and the image strings interpolate the registry prefix, so
    # neither can be evaluated from this namespace - and evaluating them is not
    # what is wanted anyway. What is wanted is the version literal that
    # Renovate rewrites, so the defaults are read as text and the pointer is
    # followed by name to the series variable that holds it.
    - name: Read the MariaDB role defaults as text
      ansible.builtin.set_fact:
        mariadb_defaults_text: "{{ lookup('file', lookup('env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/defaults/main.yml') }}"

    - name: Determine which series variable the role installs by default
      ansible.builtin.set_fact:
        mariadb_latest_image_variable: "{{ mariadb_defaults_text | regex_findall('mariadb_container_image_latest:[^\\n]*(mariadb_container_image_v[0-9]+_[0-9]+)') | first }}"

    - name: Determine the MariaDB version the role installs by default
      ansible.builtin.set_fact:
        mariadb_expected_version: "{{ mariadb_defaults_text | regex_findall(mariadb_latest_image_variable ~ ':[^\\n]*mariadb:([0-9][^\"]*)\"') | first }}"

    - name: Wait for MariaDB service to become active (up to 180s)
      ansible.builtin.systemd:
        name: mariadb.service
      register: mariadb_service
      until: mariadb_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert MariaDB service is active
      ansible.builtin.assert:
        that: mariadb_service.status.ActiveState == 'active'
        fail_msg: "mariadb.service not active ({{ mariadb_service.status.ActiveState }})"
        success_msg: "mariadb.service is active"

    - name: Retrieve MariaDB service log for debugging
      when: mariadb_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu mariadb.service
      changed_when: false

    # A systemd unit reaching "active" only means that `docker start` has not
    # exited yet. The server still has a startup of its own to go through - on
    # a first run it initializes the data directory - so the first thing here
    # that proves a usable database rather than a running process is a query
    # the server answers itself.
    #
    # community.docker is deliberately avoided throughout this playbook: the
    # linting environment in CI has no collections installed.
    - name: Wait for MariaDB to answer a query (up to 180s)
      ansible.builtin.command:
        cmd: >-
          docker exec {{ mariadb_defaults.mariadb_identifier }}
          mariadb -u root -p{{ mariadb_root_password }} --batch --skip-column-names
          -e "SELECT 1"
      register: mariadb_select_one
      changed_when: false
      until: mariadb_select_one.rc == 0
      retries: 36
      delay: 5

    - name: Assert MariaDB answers a query
      ansible.builtin.assert:
        that: mariadb_select_one.stdout | trim == '1'
        fail_msg: "MariaDB did not answer SELECT 1: {{ mariadb_select_one.stdout | default('no output') }}"
        success_msg: "MariaDB answers SELECT 1"

    # Answering SELECT 1 needs no storage engine and no disk. A round-trip
    # through a table covers the data directory that the role bind-mounts,
    # which is the part a misconfigured deployment gets wrong.
    - name: Write to MariaDB and read it back
      ansible.builtin.command:
        cmd: >-
          docker exec {{ mariadb_defaults.mariadb_identifier }}
          mariadb -u root -p{{ mariadb_root_password }} --batch --skip-column-names
          -e "CREATE DATABASE IF NOT EXISTS molecule_roundtrip;
          CREATE TABLE IF NOT EXISTS molecule_roundtrip.t (v VARCHAR(32));
          DELETE FROM molecule_roundtrip.t;
          INSERT INTO molecule_roundtrip.t (v) VALUES ('molecule-value');
          SELECT v FROM molecule_roundtrip.t;"
      register: mariadb_roundtrip
      changed_when: true

    - name: Assert the round-trip through MariaDB works
      ansible.builtin.assert:
        that: mariadb_roundtrip.stdout | trim == 'molecule-value'
        fail_msg: "A database round-trip failed: {{ mariadb_roundtrip.stdout | default('no output') }}"
        success_msg: "A database round-trip works"

    # What playbooks ask this role for is a database and an account that can
    # use it. Logging in as that account and writing to that database is the
    # only thing here that covers the managed-database tasks and the SQL
    # template they render, including the grant.
    - name: Use the managed database as the managed user
      ansible.builtin.command:
        cmd: >-
          docker exec {{ mariadb_defaults.mariadb_identifier }}
          mariadb -u {{ mariadb_managed_database.username }} -p{{ mariadb_managed_database.password }}
          --batch --skip-column-names {{ mariadb_managed_database.name }}
          -e "CREATE TABLE IF NOT EXISTS managed (v VARCHAR(32));
          DELETE FROM managed;
          INSERT INTO managed (v) VALUES ('managed-value');
          SELECT v FROM managed;"
      register: mariadb_managed_roundtrip
      changed_when: true

    - name: Assert the managed user can use the managed database
      ansible.builtin.assert:
        that: mariadb_managed_roundtrip.stdout | trim == 'managed-value'
        fail_msg: >-
          The managed user could not use the managed database:
          {{ mariadb_managed_roundtrip.stdout | default('no output') }}
        success_msg: "The managed user can use the managed database"

    # The helper scripts are rendered as executables and are run by humans and
    # by other roles. A file whose first line is not a shebang cannot be
    # exec()ed at all, and nothing else in this scenario would notice, because
    # neither Ansible nor systemd runs them.
    - name: Read the rendered MariaDB helper scripts
      ansible.builtin.slurp:
        src: "/{{ mariadb_defaults.mariadb_identifier }}/bin/{{ item }}"
      register: mariadb_helper_scripts
      loop:
        - cli
        - cli-non-interactive
        - dump-all

    - name: Assert the rendered MariaDB helper scripts start with a shebang
      ansible.builtin.assert:
        that: (item.content | b64decode).startswith('#!')
        fail_msg: "{{ item.source }} does not start with a shebang"
        success_msg: "{{ item.source }} starts with a shebang"
      loop: "{{ mariadb_helper_scripts.results }}"
      loop_control:
        label: "{{ item.source }}"

    # And the same thing proven by exec()ing one of them. It also connects over
    # the UNIX socket that the role bind-mounts out of the container, which is
    # a path nothing else here covers.
    #
    # The script takes no arguments of its own and reads its statements from
    # standard input, where the client switches to batch output by itself.
    - name: Query MariaDB through the rendered cli-non-interactive script
      ansible.builtin.command:
        cmd: "/{{ mariadb_defaults.mariadb_identifier }}/bin/cli-non-interactive"
        stdin: "SELECT 'script-value';"
      register: mariadb_cli_non_interactive
      changed_when: false

    - name: Assert the rendered cli-non-interactive script queries MariaDB
      ansible.builtin.assert:
        that: mariadb_cli_non_interactive.stdout is search('script-value')
        fail_msg: >-
          cli-non-interactive did not query MariaDB:
          {{ mariadb_cli_non_interactive.stdout | default('no output') }}
        success_msg: "cli-non-interactive queries MariaDB over the UNIX socket"

    # Tying the running server to the version pinned in defaults/main.yml is
    # what makes this scenario a real test of the version that Renovate bumps:
    # a bump that produces an unusable image cannot pass here.
    - name: Query the version reported by the running MariaDB
      ansible.builtin.command:
        cmd: >-
          docker exec {{ mariadb_defaults.mariadb_identifier }}
          mariadb -u root -p{{ mariadb_root_password }} --batch --skip-column-names
          -e "SELECT VERSION()"
      register: mariadb_version_query
      changed_when: false

    # The reported version carries an upstream suffix (`12.1.2-MariaDB-ubu2404`).
    - name: Assert the running MariaDB is the version this role installs
      ansible.builtin.assert:
        that: (mariadb_version_query.stdout | trim).startswith(mariadb_expected_version)
        fail_msg: "MariaDB reports {{ mariadb_version_query.stdout | trim }}, {{ mariadb_latest_image_variable }} expected {{ mariadb_expected_version }}"
        success_msg: "MariaDB reports {{ mariadb_version_query.stdout | trim }}"

    - name: Show the MariaDB verification summary
      ansible.builtin.debug:
        msg:
          - "MariaDB systemd: {{ mariadb_service.status.ActiveState }}"
          - "MariaDB version: {{ mariadb_version_query.stdout | trim }}"
          - "MariaDB round-trip: {{ mariadb_roundtrip.stdout | trim }}"
          - "MariaDB managed database round-trip: {{ mariadb_managed_roundtrip.stdout | trim }}"
          - "MariaDB cli-non-interactive: {{ mariadb_cli_non_interactive.stdout | trim }}"
